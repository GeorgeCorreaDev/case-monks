[project]
name = "monks-media-analyst"
version = "0.1.0"
description = "agente ia analista junior de midia — case monks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "google-cloud-bigquery>=3.25",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "langchain-community>=0.3",
    "tenacity>=9.0",
    "langchain-anthropic>=1.4.3",
    "langchain-google-genai>=4.2.2",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "services", "agent_logic", "api"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.12",
]
