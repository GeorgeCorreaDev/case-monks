<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monks Media Agent | Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0a0a0c] text-slate-200 font-['Inter'] min-h-screen flex flex-col">
    
  
    <nav class="border-b border-slate-800/50 bg-[#0a0a0c]/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                    <i data-lucide="bot" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-bold text-lg tracking-tight">Monks <span class="text-indigo-500">Media</span></span>
            </div>
            <div class="flex items-center gap-4 text-xs text-slate-400">
                <span class="flex items-center gap-1"><span class="w-2 h-2 bg-green-500 rounded-full"></span> API Online</span>
                <a href="/docs" target="_blank" class="hover:text-white transition-colors">Docs</a>
            </div>
        </div>
    </nav>

    
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col overflow-hidden">
        
        <div id="chat-container" class="flex-1 overflow-y-auto space-y-6 py-8 px-2 scroll-smooth">
            
            <div class="flex flex-col items-center justify-center py-20 text-center space-y-4 opacity-50" id="welcome-msg">
                <i data-lucide="sparkles" class="w-12 h-12 text-indigo-400"></i>
                <div>
                    <h1 class="text-xl font-semibold text-white">Olá! Eu sou o Monge Analista.</h1>
                    <p class="text-sm max-w-xs mx-auto">Pergunte-me sobre ROI, conversão ou performance de canais em 2024.</p>
                </div>
            </div>
        </div>

        
        <div class="pt-4 pb-8">
            <div class="relative max-w-4xl mx-auto group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl blur opacity-20 group-focus-within:opacity-40 transition duration-500"></div>
                <div class="relative bg-[#16161a] rounded-2xl border border-slate-800 p-2 flex items-center gap-2">
                    <textarea 
                        id="user-input" 
                        rows="1" 
                        placeholder="Qual canal trouxe mais receita ontem?" 
                        class="flex-1 bg-transparent border-none focus:ring-0 text-slate-100 placeholder-slate-500 px-4 py-3 resize-none max-h-32"
                    ></textarea>
                    <button 
                        id="send-btn"
                        class="p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <p class="text-[10px] text-center text-slate-600 mt-4">Analista Júnior operando via LangGraph + OpenAI. Os custos são auditados em tempo real.</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
